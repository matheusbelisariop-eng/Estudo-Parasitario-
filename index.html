<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudo Parasitário</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f3ed;color:#1b2821;font:16px/1.5 system-ui,sans-serif}
    main{max-width:560px;margin:24px;padding:24px;border:1px solid #d9ded5;border-radius:14px;background:#fffefa}
    h1{font:28px Georgia,serif;color:#1c674f;margin:0 0 10px}
    p{color:#65726b}
  </style>
</head>
<body>
  <main id="status">
    <h1>Estudo Parasitário</h1>
    <p>Carregando o material e as imagens dos parasitos…</p>
  </main>
<script>
(async function(){
  const api='https://api.github.com/repos/matheusbelisariop-eng/Estudo-Parasitario-/git/blobs/f7b9a725fbe5bad2d584da40cb385950f5f3c961';
  function showError(message){
    const box=document.getElementById('status');
    if(box)box.innerHTML='<h1>Não foi possível carregar o material</h1><p>'+message+'</p><p>Confira sua conexão e tente novamente.</p>';
  }
  try{
    const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'}});
    if(!response.ok)throw new Error('O GitHub não conseguiu entregar a versão original do arquivo ('+response.status+').');
    const blob=await response.json();
    if(!blob.content||blob.encoding!=='base64')throw new Error('O arquivo original não veio em um formato reconhecido.');
    const binary=atob(blob.content.replace(/\s/g,''));
    const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
    let html=new TextDecoder('utf-8').decode(bytes);

    const cssAnchor='.video-thumb img{display:block;width:100%;height:100%;object-fit:cover}';
    if(!html.includes('.image-search img{')){
      if(!html.includes(cssAnchor))throw new Error('Não encontrei o estilo dos cartões de imagem.');
      html=html.replace(cssAnchor,cssAnchor+'.image-search img{object-fit:contain;padding:8px;background:#f7f7f1}.image-loading{display:grid;place-items:center;width:100%;height:100%;padding:18px;text-align:center;color:#65726b;font-size:13px}.image-fallback{position:absolute;inset:0}.image-fallback .cycle-poster{height:100%}');
    }

    const start=html.indexOf('function card(x,i,gi){');
    const end=html.indexOf('\nfunction norm(s)',start);
    if(start<0||end<0)throw new Error('Não encontrei a função dos cartões no arquivo original.');

    const replacement=String.raw`function imageSearchQuery(label,gi){
 const s=norm(label);
 if(gi===0)return 'cutaneous larva migrans skin lesion Ancylostoma braziliense';
 if(gi===1)return label+' adult trematode fluke parasite specimen';
 if(gi===2)return label+' cestode parasite hydatid cyst specimen';
 if(gi===3){
  if(/cochliomyia hominivorax/.test(s))return 'Cochliomyia hominivorax screwworm larva';
  if(/cordylobia/.test(s))return 'Cordylobia anthropophaga tumbu fly larva';
  if(/cochliomyia macellaria|chrysomya|lucilia/.test(s))return 'myiasis fly larvae wound';
  if(/pulgas|pulex|ctenocephalides|xenopsylla/.test(s))return 'flea insect Ctenocephalides macro';
  if(/sarcoptes/.test(s))return 'Sarcoptes scabiei mite microscopy scabies';
  if(/tunga/.test(s))return 'Tunga penetrans tungiasis foot';
  if(/carrapatos|ixodes|amblyomma/.test(s))return 'Ixodes Amblyomma tick';
  return 'cutaneous larva migrans skin lesion hookworm';
 }
 if(gi===4)return label+' protozoan parasite microscopy';
 return label+' parasite';
}
function imageCycleFallback(img){
 if(img.dataset.fallbackDone==='1')return;
 img.dataset.fallbackDone='1';
 const card=img.closest('.card');
 const frame=img.closest('.image-search');
 if(!card||!frame)return;
 const cycle=card.querySelector('.cycle');
 const fallback=document.createElement('div');
 fallback.className='image-fallback';
 fallback.innerHTML=cycleDiagram({label:img.dataset.label,cycle:cycle?cycle.textContent:img.dataset.label});
 frame.appendChild(fallback);
 const loading=frame.querySelector('.image-loading');
 if(loading)loading.textContent='Imagem não encontrada; esquema do ciclo disponível.';
}
function card(x,i,gi){
 let url=x.k==='s'?'https://www.youtube.com/results?search_query='+encodeURIComponent(x.q):yt(x.id);
 let label=x.k==='s'?'Ver vídeos relacionados ↗':'Abrir vídeo no YouTube ↗';
 let imageMode=x.k==='s'&&gi!==5;
 let media=gi===5?mycosisPhoto(x.label):imageMode?'<div class="video-thumb image-search"><div class="image-loading">Procurando imagem do parasito…</div><img data-query="'+esc(imageSearchQuery(x.label,gi))+'" data-label="'+esc(x.label)+'" alt="Imagem de '+esc(x.label)+'" loading="lazy" hidden></div>':'<div class="video-thumb video-frame"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/'+esc(x.id.split('&')[0])+'?rel=0" title="'+esc(x.label)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><a class="fallback" href="'+url+'" target="_blank" rel="noopener">Se o player não abrir, veja o vídeo no YouTube ↗</a>';
 if(gi===5)return '<article class="card" data-text="'+esc((x.label+' '+x.cycle).toLocaleLowerCase('pt-BR'))+'"><h3>'+esc(x.label)+'</h3>'+media+'</article>';
 let row=imageMode?'<div class="row"><span>Imagem do parasito ou da manifestação clínica</span></div>':'<div class="row"><span>Etapas do ciclo</span><a class="link" href="'+url+'" target="_blank" rel="noopener">'+label+'</a></div>';
 return '<article class="card" data-text="'+esc((x.label+' '+x.cycle).toLocaleLowerCase('pt-BR'))+'"><h3>'+esc(x.label)+'</h3>'+media+'<div class="cycle">'+esc(x.cycle)+'</div>'+row+'</article>';
}
async function loadCommonsImage(img){
 const query=img.dataset.query||img.dataset.label||'parasite';
 const api='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:bitmap '+query)+'&gsrnamespace=6&gsrlimit=40&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1000&format=json&origin=*';
 const loading=img.previousElementSibling;
 img.onerror=()=>imageCycleFallback(img);
 try{
  const response=await fetch(api);
  if(!response.ok)throw new Error('Falha na pesquisa de imagens');
  const data=await response.json();
  const pages=Object.values(data.query?.pages||{});
  const candidates=pages.map(page=>page.imageinfo&&page.imageinfo[0]).filter(info=>{
   if(!info||!(info.thumburl||info.url))return false;
   const meta=info.extmetadata||{};
   const license=norm([meta.LicenseShortName?.value,meta.UsageTerms?.value].join(' '));
   return /public domain|dominio publico|cc0|cc zero|pdm|pd us|pd old|pd art/.test(license);
  });
  const selected=candidates.find(info=>/\.(jpe?g|png|webp)(\?|$)/i.test(info.thumburl||info.url))||candidates[0];
  if(!selected)throw new Error('Nenhuma imagem de domínio público ou CC0 foi localizada');
  img.src=selected.thumburl||selected.url;
  img.hidden=false;
  if(loading)loading.remove();
 }catch(error){
  imageCycleFallback(img);
 }
}
function loadCommonsImages(images){images.forEach(img=>loadCommonsImage(img));}
`;
    html=html.slice(0,start)+replacement+html.slice(end);

    const callAnchor="document.querySelector('#filter').oninput=";
    if(!html.includes(callAnchor))throw new Error('Não encontrei a inicialização da busca do site.');
    if(!html.includes("loadCommonsImages(document.querySelectorAll('.image-search img'))")){
      html=html.replace(callAnchor,"loadCommonsImages(document.querySelectorAll('.image-search img'));\n"+callAnchor);
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    showError(error&&error.message?error.message:'Ocorreu um erro inesperado.');
  }
})();
</script>
</body>
</html>
